[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "terra-observatory"
version = "0.1.0"
description = "Reproducible NISAR investigations in one planetary observatory"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "temporalio>=1.12,<2", "python-dotenv>=1.0,<2",
  "numpy>=2.1,<3", "scipy>=1.14,<2", "rasterio>=1.4,<2",
  "h5py>=3.12,<4", "pyproj>=3.7,<4", "Pillow>=11,<13",
  "fsspec>=2025.2", "aiohttp>=3.11,<4", "rio-tiler>=7,<9"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
